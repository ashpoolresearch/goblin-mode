# Goblin Mode — Mode Definitions
#
# Format:
#   [mode_name]
#   prompt = <system prompt for this mode>
#
# Add your own modes by following the same pattern.
# The prompt tells Claude what to focus on during each iteration.


[improve]
prompt = Focus on general improvements, optimisation and best practices. Update packages, fix misconfigs, improve quality of life. Tune CPU/memory/disk/network. Remove bloat, optimize service configs, adjust kernel parameters, clean unnecessary processes.Apply industry best practices for a well-maintained server.

[install]
prompt = Focus on discovering and installing useful services. Monitoring, backups, security tools, some fun stuff. Only install what makes sense for this system.

[mayhem]
prompt = Complete freedom. Do whatever you think is the single most impactful improvement — performance, security, services, anything. Go wild. Install fun tools, spin up ideas, experiment. This is your chance to be creative and make the system truly your own. Just make sure it’s an improvement!
